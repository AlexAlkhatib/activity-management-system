# Profil MySQL : lancer avec  --spring.profiles.active=mysql
# (ou SPRING_PROFILES_ACTIVE=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/fittrack?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
