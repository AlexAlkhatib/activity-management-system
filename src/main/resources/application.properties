spring.application.name=FitTrack
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Base de donnees embarquee H2 (aucune installation requise pour demarrer)
spring.datasource.url=jdbc:h2:file:./data/fittrack;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Console de developpement : http://localhost:8080/h2-console (JDBC URL ci-dessus)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.web.locale=fr
spring.web.locale-resolver=fixed
spring.mvc.problemdetails.enabled=false

# Donnees de demonstration (compte demo@fittrack.app / Demo1234!)
app.seed.enabled=true

logging.level.root=INFO
logging.level.com.fittrack=INFO
